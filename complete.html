<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Submission Complete</title>
    <style>
    body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
    .container { max-width: 420px; margin: 50px auto; padding: 30px; background-color: #FBFEFD; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #069C54; }
    h3 { text-align: center; margin-bottom: 25px; }
    .form-group { margin-bottom: 12px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
    label { font-weight: bold; display: block; margin-bottom: 3px; color: #555; }
    .custom-button { display: block; margin: 20px auto 0; padding: 12px 30px; font-size: 16px; font-weight: bold; color: #fff; background-color: #069C54; border: none; border-radius: 5px; text-align: center; text-decoration: none; cursor: pointer; transition: background-color 0.3s ease; }
    .custom-button:hover { background-color: #048654; }
    </style>
</head>
<body>
<div class="container">
    <h2>Thank You! 🎉</h2>
    <h3>Form Submission Complete</h3>
    <div class="form-group"><label>Name:</label><span id="name"></span></div>
    <div class="form-group"><label>Email:</label><span id="email"></span></div>
    <div class="form-group"><label>Phone:</label><span id="phone"></span></div>
    <div class="form-group"><label>Address:</label><span id="address"></span></div>
    <div class="form-group"><label>Delivery Date:</label><span id="date"></span></div>
    <div class="form-group"><label>Menu Option:</label><span id="menu"></span></div>
    <div class="form-group"><label>Spicy Level:</label><span id="spicy"></span></div>
    <a href="index.html" class="custom-button">Kembali ke Menu</a>
</div>
<script>
    const params = new URLSearchParams(window.location.search);
    ['name','email','phone','address','date','menu','spicy'].forEach(id => {
        const el = document.getElementById(id);
        if(el) el.textContent = params.get(id) || '-';
    });
</script>
</body>
</html>
